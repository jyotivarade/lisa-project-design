[project]
name = "lisa-backend"
version = "0.1.0"
description = "LISA — Laboratory Information System Analysis (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = [
    "integration: requires a live PostgreSQL database",
    "slow: performance checks, deselected by default (run with -m slow)",
]
# Performance checks are opt-in so the everyday suite stays fast.
addopts = "-q --strict-markers -m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated migrations are not hand-written source.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# AD-3: the criteria package is held to a stricter standard than the rest of the app.
module = "app.criteria.*"
strict = true
