<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LISA — Laboratory Information System Analysis</title>
<link rel="preconnect" href="">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<!-- ============================== LOGIN ============================== -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-bg" aria-hidden="true">
    <span class="auth-blob b1"></span>
    <span class="auth-blob b2"></span>
    <span class="auth-grid"></span>
  </div>

  <div class="auth-wrap">
    <div class="auth-card" role="main">
      <div class="auth-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26"><path d="M7 3h6v9.5a5 5 0 0 1-.9 2.85L6.3 24.1A3.6 3.6 0 0 0 9.25 29.8h13.5a3.6 3.6 0 0 0 2.95-5.7l-5.8-8.75a5 5 0 0 1-.9-2.85V3h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M8.6 20.5h14.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </div>
        <h1 class="brand-name">LISA</h1>
        <p class="brand-sub">Laboratory Information System Analysis</p>
      </div>

      <form id="login-form" novalidate autocomplete="on">
        <div class="field">
          <label for="login-email">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 7l9 6 9-6M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <input type="email" id="login-email" name="email" placeholder="you@laboratory.com" autocomplete="username">
          </div>
          <p class="field-error" id="err-email"></p>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="input-affix" id="toggle-password" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
            </button>
          </div>
          <p class="field-error" id="err-password"></p>
        </div>

        <div class="auth-row">
          <label class="check"><input type="checkbox" id="remember-me"><span class="box"></span><span>Remember me</span></label>
          <button type="button" class="link-btn" id="forgot-link">Forgot Password?</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
          <span class="btn-label">Sign In</span>
        </button>

        <p class="auth-hint">
          Prototype credentials — <strong>admin@analytics.com</strong> / <strong>Admin@123</strong>
          <button type="button" class="link-btn" id="fill-demo">Autofill</button>
        </p>
      </form>
    </div>

    <p class="auth-foot">LISA v2.0 · Laboratory Information System Analysis · Prototype build</p>
  </div>
</div>

<!-- ============================== APP SHELL ============================== -->
<div id="app-shell" class="app-shell" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark sm" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="20" height="20"><path d="M7 3h6v9.5a5 5 0 0 1-.9 2.85L6.3 24.1A3.6 3.6 0 0 0 9.25 29.8h13.5a3.6 3.6 0 0 0 2.95-5.7l-5.8-8.75a5 5 0 0 1-.9-2.85V3h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M8.6 20.5h14.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <div class="sidebar-brand-text">
        <span class="sb-name">LISA</span>
        <span class="sb-sub">Lab Information System Analysis</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main navigation"><!-- rendered by JS --></nav>

    <div class="sidebar-foot">
      <div class="sb-user">
        <span class="avatar" id="sb-avatar">AU</span>
        <span class="sb-user-text">
          <span class="sb-user-name" id="sb-user-name">Admin User</span>
          <span class="sb-user-role" id="sb-user-role">Administrator</span>
        </span>
      </div>
      <button class="sb-logout" id="sb-logout" title="Logout">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebar-scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="sidebar-toggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>

      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

      <div class="topbar-right">
        <div class="pop-wrap">
          <button class="icon-btn" id="notif-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M18 15V10a6 6 0 1 0-12 0v5l-1.6 2.4h15.2zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="dot" id="notif-dot"></span>
          </button>
          <div class="popover" id="notif-pop" hidden>
            <div class="pop-head"><span>Notifications</span><button class="link-btn" id="notif-clear">Mark all read</button></div>
            <div class="pop-body" id="notif-list"></div>
            <div class="pop-foot"><button class="link-btn" data-nav="audit">View audit log</button></div>
          </div>
        </div>

        <div class="pop-wrap">
          <button class="user-btn" id="user-btn">
            <span class="avatar sm">AU</span>
            <span class="user-btn-name">Admin User</span>
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div class="popover right" id="user-pop" hidden>
            <div class="pop-user">
              <span class="avatar">AU</span>
              <span><strong>Admin User</strong><em>admin@analytics.com</em></span>
            </div>
            <div class="pop-body">
              <button class="pop-item" data-nav="settings#profile">Profile</button>
              <button class="pop-item" data-nav="settings">Settings</button>
              <button class="pop-item" data-nav="audit">Audit Logs</button>
            </div>
            <div class="pop-foot"><button class="pop-item danger" id="user-logout">Logout</button></div>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="view" tabindex="-1"><!-- rendered by JS --></main>
  </div>
</div>

<!-- ============================== OVERLAYS ============================== -->
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<div class="modal-root" id="modal-root" hidden>
  <div class="modal-scrim" data-close-modal></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h3 id="modal-title">Title</h3>
      <button class="icon-btn ghost" data-close-modal aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</div>

<div class="drawer-root" id="drawer-root" hidden>
  <div class="drawer-scrim" data-close-drawer></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true">
    <header class="drawer-head">
      <div>
        <p class="drawer-eyebrow" id="drawer-eyebrow"></p>
        <h3 id="drawer-title">Title</h3>
      </div>
      <button class="icon-btn ghost" data-close-drawer aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
    <footer class="drawer-foot" id="drawer-foot"></footer>
  </aside>
</div>

<script src="assets/js/util.js"></script>
<script src="assets/js/expr.js"></script>
<script src="assets/js/rules.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/screens-core.js"></script>
<script src="assets/js/screens-workflow.js"></script>
<script src="assets/js/screens-validation.js"></script>
<script src="assets/js/screens-patient.js"></script>
<script src="assets/js/screens-admin.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
